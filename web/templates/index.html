<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIdetect 监测中心</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --accent:#38bdf8; --warn:#f59e0b; --danger:#ef4444; }
        body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
        header { padding:1rem 2rem; background:var(--card); border-bottom:1px solid #334155; display:flex; align-items:center; justify-content:space-between; }
        h1 { margin:0; font-size:1.5rem; }
        .layout { display:grid; grid-template-columns: minmax(0,2fr) minmax(320px,1fr); gap:1rem; padding:1rem; }
        @media (max-width: 1100px){ .layout { grid-template-columns: 1fr; } }
        .panel { background:var(--card); border-radius:0.75rem; padding:1rem; }
        .panel h2 { margin:0 0 0.75rem 0; font-size:1.1rem; color:var(--accent); }
        /* 合成九宫格：只有一路 MJPEG(/video_grid)，各路画面在服务器端拼成 3x3 大图。
           单端口 9 路独立流会占满浏览器连接上限，导致 API 轮询/一键清除永远排队。 */
        .videos { position:relative; border:1px solid #334155; border-radius:0.5rem; overflow:hidden; background:#0b1220; }
        .videos img.grid { width:100%; display:block; aspect-ratio:16/9; object-fit:contain; background:#000; }
        .ovl { position:absolute; width:33.333%; height:33.333%; pointer-events:none; }
        .ovl .hd { display:flex; justify-content:space-between; align-items:center; gap:0.4rem;
                   padding:0.3rem 0.5rem; font-size:0.8rem;
                   background:linear-gradient(rgba(2,6,23,0.75), rgba(2,6,23,0)); }
        .ovl .hd b { color:var(--text); }
        .ovl .hd .s { color:#94a3b8; font-size:0.72rem; }
        .ovl.online { box-shadow: inset 0 0 0 2px rgba(14,165,233,0.65); border-radius:0.25rem; }
        .total { display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:0.75rem; }
        .stat { background:#0f172a; padding:0.5rem 0.85rem; border-radius:0.5rem; }
        .stat .num { font-size:1.3rem; font-weight:bold; color:var(--accent); }
        .stat .label { font-size:0.75rem; color:#3d81e0; }
        .events-head { display:flex; justify-content:space-between; align-items:center; }
        .btn-clear { background:var(--danger); color:#fff; border:none; border-radius:0.4rem; padding:0.4rem 0.9rem; font-size:0.85rem; cursor:pointer; }
        .btn-clear:hover { background:#dc2626; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th, td { padding:0.5rem; text-align:left; border-bottom:1px solid #334155; }
        th { color:#3b7fdf; }
        .badge { padding:0.15rem 0.4rem; border-radius:0.25rem; font-size:0.75rem; }
        .rockfall { background:rgba(34,197,94,0.2); color:#4ade80; }
        .landslide { background:rgba(59,130,246,0.2); color:#60a5fa; }
        .collapse { background:rgba(239,68,68,0.2); color:#f87171; }
        .moving { color:var(--danger); font-weight:bold; }
        td img.snap { width:72px; height:44px; object-fit:cover; border-radius:0.25rem; cursor:zoom-in; background:#000; }
    </style>
</head>
<body>
    <header>
        <h1>AIdetect 监测中心</h1>
        <div id="conn" style="color:#4ade80">● 实时连接中</div>
    </header>
    <div class="layout">
        <div class="panel">
            <h2>实时视频</h2>
            <div class="total">
                <div class="stat"><div class="num" id="t_fps">-</div><div class="label">总帧率 FPS</div></div>
                <div class="stat"><div class="num" id="t_active">-</div><div class="label">活跃目标合计</div></div>
                <div class="stat"><div class="num" id="t_cams">-</div><div class="label">在线通道</div></div>
            </div>
            <div class="videos">
                <img class="grid" src="/video_grid" alt="">
                <div id="overlays"></div>
            </div>
        </div>
        <div class="panel">
            <div class="events-head">
                <h2>事件列表</h2>
                <button class="btn-clear" id="btnClear">一键清除</button>
            </div>
            <table>
                <thead><tr><th>截图</th><th>时间</th><th>通道</th><th>类型</th><th>事件</th><th>置信度</th></tr></thead>
                <tbody id="events"></tbody>
            </table>
        </div>
    </div>
    <script>
        const NUM_SLOTS = 9;        // 固定 9 个通道槽位(3x3)
        const slotEls = new Map();  // cam -> {ovl, stat}

        function fmt(v, d=1){ return (v === undefined || v === null) ? '-' : Number(v).toFixed(d); }

        // 9 个槽位标签浮层，与服务器拼的 3x3 大图逐格对齐(每格 1/3 宽高)
        (function initSlots(){
            const box = document.getElementById('overlays');
            for(let i = 0; i < NUM_SLOTS; i++){
                const ovl = document.createElement('div');
                ovl.className = 'ovl';
                ovl.style.left = (i % 3) * 33.333 + '%';
                ovl.style.top  = Math.floor(i / 3) * 33.333 + '%';
                ovl.innerHTML =
                    `<div class="hd"><b>通道 ${i}</b><span class="s" id="s_${i}">未接入</span></div>`;
                box.appendChild(ovl);
                slotEls.set(String(i), { ovl, stat: ovl.querySelector('#s_' + i) });
            }
        })();

        // stats 形如 {"0":{fps,infer_ms,active,source}, ...}；兼容旧版扁平结构
        function renderCams(stats){
            if(stats.fps !== undefined) stats = {'0': stats};
            let totalFps = 0, totalActive = 0, n = 0;
            for(const [cam, s] of Object.entries(stats)){
                const slot = slotEls.get(String(cam));
                if(!slot) continue;
                slot.ovl.classList.add('online');
                slot.stat.innerText = `${fmt(s.fps)} fps · ${fmt(s.infer_ms)} ms · 活跃 ${s.active ?? 0}`;
                totalFps += s.fps || 0;
                totalActive += s.active || 0;
                n++;
            }
            document.getElementById('t_fps').innerText = totalFps.toFixed(1);
            document.getElementById('t_active').innerText = totalActive;
            document.getElementById('t_cams').innerText = `${n} / ${NUM_SLOTS}`;
        }

        async function loadStats(){
            try {
                const r = await fetch('/api/stats');
                renderCams(await r.json());
                const c = document.getElementById('conn');
                c.innerText = '● 实时连接中'; c.style.color = '#4ade80';
            } catch(err) {
                const c = document.getElementById('conn');
                c.innerText = '● 连接断开'; c.style.color = '#ef4444';
            }
        }

        async function loadEvents(){
            try {
                const r = await fetch('/api/events?limit=30');
                const data = await r.json();
                const tbody = document.getElementById('events');
                tbody.innerHTML = '';
                for(const e of data.events){
                    const tr = document.createElement('tr');
                    const snap = e.image_path
                        ? `<img class="snap" src="/${e.image_path}" loading="lazy" onclick="window.open('/${e.image_path}','_blank')">`
                        : '<span style="color:#475569">-</span>';
                    tr.innerHTML =
                        `<td>${snap}</td>` +
                        `<td>${e.ts}</td>` +
                        `<td>${e.cam ?? 0}</td>` +
                        `<td><span class="badge ${e.label}">${e.label}</span></td>` +
                        `<td class="${e.kind==='moving'?'moving':''}">${e.kind}</td>` +
                        `<td>${(e.conf||0).toFixed(2)}</td>`;
                    tbody.appendChild(tr);
                }
            } catch(err) { /* 事件拉取失败不影响视频 */ }
        }

        // 一键清除：删库里的全部事件，同时把对应截图文件一并删掉
        document.getElementById('btnClear').addEventListener('click', async () => {
            if(!confirm('确定清除全部告警事件(含截图)？')) return;
            try {
                const r = await fetch('/api/events', { method: 'DELETE' });
                const d = await r.json();
                alert(d.ok ? `已清除 ${d.removed} 条事件` : '清除失败');
                loadEvents();
            } catch(err) { alert('清除失败: ' + err); }
        });

        setInterval(loadStats, 1000);
        setInterval(loadEvents, 2000);
        loadStats();
        loadEvents();

        // 合成流断线自动重连(后端重启/网络抖动后不用手动刷新页面)
        const gridImg = document.querySelector('.videos img.grid');
        gridImg.addEventListener('error', () => {
            setTimeout(() => { gridImg.src = '/video_grid?ts=' + Date.now(); }, 3000);
        });
    </script>
</body>
</html>
